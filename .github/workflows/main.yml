name: New Grad Job Monitor

on:
  schedule:
    # Runs twice per hour
    - cron: '21,51 * * * *'

  # Allows manual testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create state directory
        run: mkdir -p job_state

      - name: Download latest New Grad README
        run: |
          curl -L \
            "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/README.md" \
            -o /tmp/latest_newgrad.md

      - name: Detect new New Grad jobs
        id: newgrad
        run: |
          if [ ! -f job_state/README.md ]; then
            echo "First run - creating baseline."
            cp /tmp/latest_newgrad.md job_state/README.md
            echo "found=false" >> $GITHUB_OUTPUT
          else
            grep -Fvx -f job_state/README.md /tmp/latest_newgrad.md \
              | grep '^|' \
              > /tmp/new_newgrad_jobs.txt || true

            if [ -s /tmp/new_newgrad_jobs.txt ]; then
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Debug detected jobs
        if: steps.newgrad.outputs.found == 'true'
        run: |
          echo "=== NEW NEW-GRAD JOBS ==="
          echo "Number of rows detected:"
          wc -l /tmp/new_newgrad_jobs.txt

          echo "=== FIRST 20 ROWS ==="
          head -20 /tmp/new_newgrad_jobs.txt

      - name: Notify Discord
        if: steps.newgrad.outputs.found == 'true'
        run: |
          JOBS=$(head -c 1600 /tmp/new_newgrad_jobs.txt)

          jq -n \
            --arg content "🎓 **New New-Grad Positions**"$'\n\n'"$JOBS" \
            '{content: $content}' \
            > /tmp/discord_payload.json

          curl \
            -H "Content-Type: application/json" \
            -d @/tmp/discord_payload.json \
            "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save latest job board
        run: |
          cp /tmp/latest_newgrad.md job_state/README.md

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add job_state/

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update New Grad job board state"
            git push
          fi
